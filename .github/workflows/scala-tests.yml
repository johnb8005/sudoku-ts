name: Scala tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: temurin:21

      - name: Run Scala tests
        working-directory: ./scala
        run: scala-cli test .
